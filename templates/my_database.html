<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Story - Database</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            linear-gradient(
                rgba(10, 20, 40, 0.75),
                rgba(10, 20, 40, 0.85)
            );
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
    }
    .container {
        width: 100%;
        max-width: 450px;
        padding: 20px;
    }
    .login-box {
        width: 100%;
        padding: 40px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        text-align: center;
        animation: fadeIn 0.6s ease;
    }
    .logo {
        font-size: 55px;
        margin-bottom: 10px;
    }
    h1 {
        font-size: 30px;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .subtitle {
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        margin-bottom: 30px;
    }
    .input-group {
        margin-bottom: 18px;
        text-align: left;
    }
    .input-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
    }
    .input-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }
    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.55);
    }
    .input-group input:focus {
        border-color: #64b5ff;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 0 3px rgba(100, 181, 255, 0.15);
    }
    .login-button {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(
            135deg,
            #2196f3,
            #1565c0
        );
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
    }
    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(33, 150, 243, 0.45);
    }
    .login-button:active {
        transform: translateY(0);
    }
    .error {
        margin-top: 20px;
        padding: 12px 15px;
        border-radius: 8px;
        background: rgba(244, 67, 54, 0.18);
        border: 1px solid rgba(244, 67, 54, 0.4);
        color: #ffb4ad;
        font-size: 14px;
    }
    .database-box {
        width: 100%;
        padding: 45px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        text-align: center;
        animation: fadeIn 0.6s ease;
    }
    .database-icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: linear-gradient(
            135deg,
            #00c853,
            #087f23
        );
        font-size: 42px;
        box-shadow: 0 10px 25px rgba(0, 200, 83, 0.3);
    }
    .database-box h2 {
        font-size: 30px;
        margin-bottom: 10px;
    }
    .database-box p {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 25px;
    }
    .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 30px;
        background: rgba(0, 200, 83, 0.15);
        border: 1px solid rgba(0, 200, 83, 0.35);
        color: #69f0ae;
        font-size: 14px;
        font-weight: 600;
    }
    .status-dot {
        width: 9px;
        height: 9px;
        background: #00e676;
        border-radius: 50%;
        box-shadow: 0 0 10px #00e676;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 500px) {
        .container {
            padding: 15px;
        }
        .login-box,
        .database-box {
            padding: 30px 22px;
        }
        h1 {
            font-size: 26px;
        }
        .database-box h2 {
            font-size: 26px;
        }
    }
</style>
</head>
<body>
<div class="container">
<div class="login-box" style="display: {{ 'none' if result == 'authorized' else 'block' }};">
    <div class="logo">🗄️</div>
    <h1>Travel Story</h1>
    <p class="subtitle">Secure Database Access</p>
    <form action="/database_login" method="post">
        <div class="input-group">
            <label for="username">USER ID</label>
            <input type="text" id="username" name="username" placeholder="Enter USER ID" autocomplete="username" required>
        </div>
        <div class="input-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-button">🔐 Login into Database</button>
    </form>
    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}
</div>
<div class="database-box" style="display: {{ 'block' if result == 'authorized' else 'none' }};">
  {{connection}}
</div>
</div>
</body>
</html>
