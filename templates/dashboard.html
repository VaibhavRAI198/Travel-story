<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css_folder/common.css') }}">
    <title>Travel Story</title>
</head>
<body>
<div class="dashboard">
    <!-- =====================================================
         LEFT SIDEBAR
    ====================================================== -->
    <aside class="left">
        <fieldset class="sidebar-box header-box">
            <div class="header">
                <div class="logo-icon">✈️</div>
                <div class="header-text">
                    <h1>Travel Story</h1>
                    <p>Welcome {{ user_data["full_name"] }} !</p>
                </div>
            </div>
        </fieldset>

        <fieldset class="sidebar-box navigation-box">
            <legend>Navigation</legend>
            <div class="navigation">
                <a href="{{ url_for('dashboard') }}" class="nav-btn active" title="Dashboard"><span>🏠</span></a>
                <a href="{{ url_for('my_profile') }}" class="nav-btn" title="My Profile"><span>👤</span></a>
                <a href="{{ url_for('setting') }}" class="nav-btn" title="Settings"><span>⚙️</span></a>
                <a href="{{ url_for('about_me') }}" class="nav-btn" title="About Me"><span>ℹ️</span></a>
                <a href="{{ url_for('logout') }}" class="nav-btn logout" title="Logout"><span>🚪</span></a>
                <!-- MOBILE CITY MENU -->
                <button type="button" class="nav-btn menu-btn" id="cityMenuButton" onclick="toggleCityMenu()" title="My Cities"><span>☰</span></button>
            </div>
        </fieldset>
        <section class="city-section" id="citySection">
            <div class="city-header">
                <a href="#" class="city-item add-city"><span class="city-icon">＋</span><span>Add City</span></a>
            </div>
            <div class="city_area">
                <a href="#" class="city-item"><span class="city-icon">📍</span><span>Delhi</span></a>
            </div>
        </section>
    </aside>
    <main class="content">
    </main>
</div>
<script>
function toggleCityMenu() {
    const citySection = document.getElementById("citySection");
    const menuButton = document.getElementById("cityMenuButton");
    citySection.classList.toggle("mobile-show");
    menuButton.classList.toggle("menu-active");
}
</script>
</body>
</html>
