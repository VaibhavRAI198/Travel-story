<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css_folder/common.css') }}">

    <title>Travel Story</title>

</head>


<body>

<div class="dashboard">


    <!-- =====================================================
         LEFT / SIDEBAR
    ====================================================== -->

    <aside class="left">


        <!-- =================================================
             HEADER
        ================================================== -->

        <fieldset class="sidebar-box header-box">

            <div class="header">

                <div class="logo-icon">
                    ✈️
                </div>

                <div>

                    <h1>
                        Travel Story
                    </h1>

                    <p>
                        Welcome, {{ user_data["full_name"] }}
                    </p>

                </div>

            </div>

        </fieldset>



        <!-- =================================================
             NAVIGATION BUTTON AREA
        ================================================== -->

        <fieldset class="sidebar-box navigation-box">

            <legend>
                SETTING
            </legend>


            <div class="navigation">


                <!-- Dashboard -->

                <a href="{{ url_for('dashboard') }}"
                   class="nav-btn active"
                   title="Dashboard">

                    <span>🏠</span>

                </a>



                <!-- Profile -->

                <a href="{{ url_for('my_profile') }}"
                   class="nav-btn"
                   title="My Profile">

                    <span>👤</span>

                </a>



                <!-- Settings -->

                <a href="{{ url_for('setting') }}"
                   class="nav-btn"
                   title="Settings">

                    <span>⚙️</span>

                </a>



                <!-- About -->

                <a href="{{ url_for('about_me') }}"
                   class="nav-btn"
                   title="About Me">

                    <span>ℹ️</span>

                </a>



                <!-- Logout -->

                <a href="{{ url_for('logout') }}"
                   class="nav-btn logout"
                   title="Logout">

                    <span>🚪</span>

                </a>



                <!-- MOBILE MENU -->

                <button type="button"
                        class="nav-btn menu-btn"
                        onclick="toggleCityMenu()"
                        title="Cities">

                    <span>☰</span>

                </button>


            </div>


        </fieldset>



        <!-- =================================================
             CITY AREA
        ================================================== -->

        <div class="city-section">


            <!-- CITY HEADER -->

            <div class="city-header">
                <a href="#"
                   class="add-city-small">

                    ＋ Add City

                </a>

            </div>



            <!-- CITY LIST -->

            <div class="city_area"
                 id="cityArea">



                <!-- CITY 1 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Delhi
                    </span>

                </a>



                <!-- CITY 2 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Mumbai
                    </span>

                </a>



                <!-- CITY 3 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Jaipur
                    </span>

                </a>



                <!-- CITY 4 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Manali
                    </span>

                </a>



                <!-- CITY 5 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Goa
                    </span>

                </a>



                <!-- CITY 6 -->

                <a href="#"
                   class="city-item">

                    <span class="city-icon">
                        📍
                    </span>

                    <span>
                        Bengaluru
                    </span>

                </a>


            </div>

        </div>


    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="content">


        <div class="content-header">

            <h2>
                Dashboard
            </h2>

            <p>
                Welcome to your Travel Story dashboard.
            </p>

        </div>



        <div class="dashboard-card">

            <h3>
                My Travel Story
            </h3>

            <p>
                Select a city from the city list to explore
                your travel stories.
            </p>

        </div>


    </main>


</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

function toggleCityMenu() {

    const cityArea =
        document.getElementById("cityArea");

    cityArea.classList.toggle("mobile-city-open");

}

</script>


</body>

</html>
