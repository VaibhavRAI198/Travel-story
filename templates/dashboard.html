<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css_folder/common.css') }}"
    >

    <title>Travel Story</title>

</head>


<body>


<div class="dashboard">


    <!-- ================= LEFT SIDEBAR ================= -->

    <aside class="left">


        <!-- HEADER AREA -->

        <fieldset class="sidebar-box header-box">

            <legend>Travel Story</legend>

            <div class="header">

                <div class="logo-icon">
                    ✈️
                </div>

                <div>
                    <h1>Travel Story</h1>
                    <p>My Travel Dashboard</p>
                </div>

            </div>

        </fieldset>



        <!-- MY SETTINGS / NAVIGATION -->

        <fieldset class="sidebar-box navigation-box">

            <legend>My Setting</legend>

            <div class="navigation">

                <a href="#">
                    <span>🏠</span>
                    Dashboard
                </a>

                <a href="#">
                    <span>👤</span>
                    My Profile
                </a>

                <a href="#">
                    <span>⚙️</span>
                    Setting
                </a>

                <a href="#">
                    <span>ℹ️</span>
                    About Me
                </a>

                <a href="#" class="logout">
                    <span>🚪</span>
                    Logout
                </a>

            </div>

        </fieldset>



        <!-- CITY AREA -->

        <fieldset class="sidebar-box city-box">

            <legend>My City</legend>

            <div class="city_area">

                <a href="#" class="add-city">
                    <span>＋</span>
                    Add City
                </a>


                <a href="#" class="city-item">

                    <span class="city-icon">
                        📍
                    </span>


                </a>


            </div>

        </fieldset>


    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="content">

        <div class="content-header">

            <h2>Dashboard</h2>

            <p>
                Welcome to your Travel Story dashboard.
            </p>

        </div>


        <div class="dashboard-card">

            <h3>My Travel Story</h3>

            <p>
                Select a city from the left side to explore
                your travel stories.
            </p>

        </div>

    </main>


</div>


</body>

</html>
