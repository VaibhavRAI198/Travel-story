<link rel="stylesheet" href="{{ url_for('static', filename='css_folder/add_city.css') }}">
<section class="add-city-page">
<div class="add-city-header">
    <div class="header-content">
        <span class="add-city-label">TRAVEL STORY</span>
        <h2>Add New City</h2>
        <p>Add a city to your travel collection and keep your journey organized.</p>
    </div>
    <div class="add-city-icon">📍</div>
</div>
<div class="add-city-card">
    <div class="card-heading">
        <div class="heading-icon">🌍</div>
        <div>
            <h3>City Details</h3>
            <p>Enter the details of the city you want to add.</p>
        </div>
    </div>
    <form method="POST" action="{{ url_for('add_city_function') }}" class="city-form">
        <input type="hidden" value="{{username}}" name="user_id" required/>
        <div class="form-grid">
            <div class="form-group">
                <label for="city_name">City Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">🏙️</span>
                    <input type="text" id="city_name" name="city_name" placeholder="Enter city name" required>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <button type="reset" class="clear-button">Clear</button>
            <button type="submit" class="save-city-button"><span>＋</span>Save City</button>
        </div>
    </form>
</div>
</section>
