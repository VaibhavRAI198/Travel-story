<link rel="stylesheet" href="{{ url_for('static', filename='css_folder/dashboard.css') }}">

<section class="dashboard-home">
    <div class="dashboard-title">
        <div>
            <span class="dashboard-label">TRAVEL STORY</span>
            <h2>Welcome back, {{ user_data["full_name"] }} 👋</h2>
            <p>Plan your journeys, save your memories and explore new places.</p>
        </div>
        <div class="date-card">
            <span>LOCAL DATE & TIME</span>
            <strong id="currentDate"></strong>
            <b id="currentTime"></b>
            <small id="currentTimezone"></small>
        </div>
    </div>

    <div class="dashboard-stats">
        <div class="stat-card">
            <div class="stat-icon">🌍</div>
            <div>
                <span>My Cities</span>
                <strong>0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📍</div>
            <div>
                <span>Places Visited</span>
                <strong>0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📸</div>
            <div>
                <span>Travel Stories</span>
                <strong>0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">❤️</div>
            <div>
                <span>Favourite Places</span>
                <strong>0</strong>
            </div>
        </div>
    </div>
</section>

<script>
function updateDateTime() {
    const now = new Date();

    document.getElementById("currentDate").textContent = now.toLocaleDateString("en-IN", {
        weekday: "long",
        day: "2-digit",
        month: "short",
        year: "numeric"
    });

    document.getElementById("currentTime").textContent = now.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });

    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const offset = -now.getTimezoneOffset();
    const sign = offset >= 0 ? "+" : "-";
    const hours = String(Math.floor(Math.abs(offset) / 60)).padStart(2, "0");
    const minutes = String(Math.abs(offset) % 60).padStart(2, "0");

    document.getElementById("currentTimezone").textContent =
        timezone + " • UTC" + sign + hours + ":" + minutes;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
